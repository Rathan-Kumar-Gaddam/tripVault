<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Brand Signature Indigo to Purple Gradient -->
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Compass North Needle Gradient -->
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Compass South Needle Gradient -->
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Drop Shadow for crisp icon rendering at 16px/32px/64px -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#tvGrad)" />
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(255,255,255,0.25)" stroke-width="8" fill="none" />

  <!-- The Signature TripVault Shield & Compass Emblem -->
  <g filter="url(#glowShadow)">
    
    <!-- Vault Outer Shield Outline -->
    <path
      d="M256 70L110 126V238C110 333 172 420 256 445C340 420 402 333 402 238V126L256 70Z"
      stroke="#FFFFFF"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Compass Dial Ring -->
    <circle 
      cx="256" 
      cy="234" 
      r="50" 
      stroke="#FFFFFF" 
      stroke-width="24" 
    />

    <!-- Compass North Needle (Pointing Up) -->
    <path
      d="M256 128L276 202H236L256 128Z"
      fill="url(#needleNorth)"
    />

    <!-- Compass South Needle (Pointing Down) -->
    <path
      d="M256 340L236 266H276L256 340Z"
      fill="url(#needleSouth)"
    />

    <!-- Compass West-East Latitudinal Ticks -->
    <path
      d="M178 234H206M306 234H334"
      stroke="#FFFFFF"
      stroke-width="20"
      stroke-linecap="round"
    />

  </g>
</svg>
